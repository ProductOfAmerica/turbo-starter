name: CI

# Trigger on every push and pull request to main.
#
# Deliberately no paths-ignore. "build" is a required status check, and a
# path-filtered workflow produces no run at all, so the check never reports and
# branch protection blocks the PR forever, with no recovery: any follow-up
# commit that is also docs-only stays filtered too. Verified on PR #176
# (README-only): mergeable=MERGEABLE, state=BLOCKED, no "build" check created.
#
# Docs-only changes are skipped at the JOB level instead. That still creates a
# check run, and per GitHub, "required status checks must have a successful,
# skipped, or neutral status", so a skipped job satisfies branch protection
# while a missing one blocks it.
#
# The weekly schedule exists because auto-merged pushes do not run CI at all.
# dependabot-auto-merge.yml merges with GITHUB_TOKEN, and GitHub suppresses
# workflow runs for events it triggers, to avoid recursion. Between 2026-04-10
# and 2026-07-25 that meant 145 commits landed on main and produced zero CI
# runs, so `pnpm audit` never re-checked main. Four high-severity next
# advisories published on ~2026-07-21 sat undetected until a human push on
# 07-25 happened to run the audit.
#
# Dependabot alerts catch some of this on their own, but the schedule is the
# only detector for a whole class it structurally cannot file: a vulnerable
# TRANSITIVE dependency whose parent needs no update. For npm, Dependabot fixes
# those by bumping the parent or dropping the sub-dependency, and when neither
# applies, the fix is a lockfile-only bump of a package that appears in no
# manifest, which it will not open a PR for. Observed twice here. GHSA-2v37-7h3g
# -55p8 (nanoid, via @tailwindcss/postcss > postcss) produced an alert on
# 2026-08-12 and no PR; this schedule caught it on 08-13. The postcss advisories
# on 07-25 went the same way and were fixed by hand in #174, which is what the
# `pnpm.overrides` block in the root package.json is. Meanwhile `next` and
# `sharp` sit in a manifest and got security PRs within a minute of their alerts.
# In a monorepo most dependencies are transitive, so this is the common case,
# not the edge one.
#
# Dependabot lands its batch on Sunday, so run midweek to halve the worst-case
# window. The minute is offset because GitHub delays scheduled runs that are
# queued on the hour.
on:
  schedule:
    - cron: '23 6 * * 4'
  # Same base-less code path as `schedule`, so the scheduled behaviour can be
  # exercised on demand instead of waiting a week.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded PR runs; Dependabot force-pushes a rebase on every lockfile conflict.
# Push events key on SHA so main-branch runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Jobs to run
jobs:
  # Decide whether anything outside docs changed. Fails safe: if the base commit
  # cannot be resolved (first push, force-push, shallow clone), assume code
  # changed and run the whole pipeline. Skipping requires positive evidence.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect non-docs changes
        id: filter
        env:
          # Only ever interpolate SHAs here, never branch names or PR titles,
          # which are attacker-controlled and would be a script-injection vector.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit unresolvable; running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          if [ -z "$CHANGED" ]; then
            echo "No diff against base; running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # code=true if ANY changed path is not documentation.
          if printf '%s\n' "$CHANGED" | grep -qvE '(\.md$|^LICENSE$|^\.vscode/|^\.idea/|^docs/)'; then
            echo "Non-docs changes present; running the full pipeline."
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change; skipping build."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v7

      # Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      # Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Security Audit
        run: pnpm audit --audit-level=high

      # Run Biome linting and formatting checks
      - name: Lint and Format Check
        run: pnpm lint:ci

      # Run TypeScript type checking via Turborepo
      - name: Type Check
        run: pnpm check-types

      # Build the Next.js app via Turborepo
      - name: Build
        run: pnpm build

      - name: Install Playwright Browsers
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: E2E Smoke Test
        run: cd apps/web && pnpm test:e2e