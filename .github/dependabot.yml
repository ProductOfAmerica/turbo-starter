version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    # Collapse multiple patch releases of the same package into one bump
    cooldown:
      default-days: 7
    # Two groups only. Every PR edits pnpm-lock.yaml, so N open PRs cost O(N^2) CI runs.
    groups:
      production:
        dependency-type: "production"
        patterns: ["*"]
      development:
        dependency-type: "development"
        patterns: ["*"]
    # Only minor and patch updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]