version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: increase
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
    # Collapse multiple patch releases of the same package into one bump
    cooldown:
      default-days: 7
    # Two groups only. Every PR edits pnpm-lock.yaml, so N open PRs cost O(N^2) CI runs.
    groups:
      production:
        dependency-type: "production"
        patterns: ["*"]
      development:
        dependency-type: "development"
        patterns: ["*"]
    # Only minor and patch updates
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Workflow actions. Majors are deliberately NOT ignored here: for actions a
  # major is usually just a runner bump (Node 20 -> 24), and skipping them is
  # what let checkout/setup-node drift three majors behind. Grouped, so this is
  # one PR however many actions move. Majors will not auto-merge, since
  # dependabot-auto-merge.yml only handles patch and minor.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]